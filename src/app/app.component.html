
<div>
  <label for="time-input" class="form-label">Select a time:</label>
  <input type="time" for="time-input" id="time-input" [(ngModel)]="timeInput" class="form-control form-control-sm" required>
</div>
<div>
  <label for="food-input" class="form-label">Enter what you ate</label><br/>
  <textarea rows="4" cols="50" name="food-input" id="food-input" [(ngModel)]="textInput" required></textarea>
</div>
<button (click)="sendInput()" class="btn btn-primary">Submit</button>

<br/>
<br/>
<br/>
<div>
  <h5>Meal Input</h5>
  <h6>name: {{meal.name}}</h6>
  <h6>serving quantity: {{meal.servingQty}}</h6>
  <h6>serving unit: {{meal.servingUnit}}</h6>
  <h6>serving in grams: {{meal.servingWeightGram}}</h6>
  <h6>calories: {{meal.calories}}</h6>
  <h6>protein: {{meal.protein}}</h6>
</div>
<button (click)="confirmMeal()" class="btn btn-primary">Confirm Meal</button>
