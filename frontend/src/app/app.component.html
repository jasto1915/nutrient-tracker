<div class="app-shell">
<div class="container py-4">

  <header class="app-header mb-4">
    <h1 class="h3 mb-1">Nutrient Tracker</h1>
    <p class="text-muted mb-0">Describe what you ate in plain English and track it against your daily goal.</p>
  </header>

  @if(errorMessage){
    <div class="alert alert-warning py-2 px-3 small" role="alert">{{errorMessage}}</div>
  }

  @if(userExists){

    <div class="row g-4">

      <div class="col-lg-7">
        <app-meal-log
          [(time)]="time"
          [parsedMeals]="parsedMeals"
          (parseRequested)="parseMeal($event)"
          (confirmed)="confirmMeal()"
          (nextDayRequested)="nextDay()" />

        <app-daily-meals [breakfast]="breakfast" [lunch]="lunch" [dinner]="dinner" />
      </div>

      <div class="col-lg-5">
        <app-nutrient-goal [nutrients]="nutrients" [goal]="goal" />

        <app-meal-suggestion
          [(time)]="time"
          [suggestions]="suggestions"
          (suggestionsRequested)="suggestMeals()"
          (suggestionAdded)="addSuggestion($event)" />

        <app-meal-history [history]="history" />
      </div>

    </div>

  }@else{

    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <app-setup-form (submitted)="createUser($event)" />
      </div>
    </div>

  }

</div>
</div>
